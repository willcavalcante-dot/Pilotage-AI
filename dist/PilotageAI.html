.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{background:var(--card2);border-radius:9px;padding:6px;text-align:center;font-size:12px}.day b{display:block;font-size:17px}.day.hot b{color:var(--warn)}

<script>window.PAI_BANK={"schema":"pilotage-ai/bank@1","version":"2026.11-starter.1","title":"Banco inicial Pilotage AI","notice":"Conteúdo inicial redigido a partir das regras citadas e revisado pelo autor (status 'reviewed'). NÃO substitui o texto oficial: confira com a edição vigente da RIPEAM-72/COLREG e com o edital do PSCPP antes de considerar 'verified'. Os resumos de regras são paráfrases, não o texto normativo.","subjects":[{"key":"ripeam","pt":"RIPEAM / COLREG","en":"COLREG"},{"key":"arte","pt":"Arte Naval","en":"Seamanship"},{"key":"nav","pt":"Navegação","en":"Navigation"},{"key":"manobra","pt":"Manobra do navio","en":"Shiphandling"},{"key":"meteo","pt":"Meteorologia e Oceanografia","en":"Meteorology"},{"key":"normam","pt":"NORMAM","en":"NORMAM"},{"key":"conv","pt":"Convenções internacionais","en":"Conventions"}],"sources":[{"id":"colreg","title":"COLREG 1972 / RIPEAM-72","publisher":"IMO; versão em português: DPC - Marinha do Brasil","edition":"Texto consolidado com emendas - conferir a edição vigente","official":true},{"id":"iala","title":"Sistema de Balizamento Marítimo IALA (Região B no Brasil)","publisher":"IALA; NORMAM/DHN para o Brasil","edition":"conferir edição vigente","official":true},{"id":"ll66","title":"Convenção Internacional sobre Linhas de Carga, 1966","publisher":"IMO","edition":"conferir edição vigente","official":true},{"id":"marpol","title":"MARPOL 73/78","publisher":"IMO","edition":"conferir edição vigente","official":true},{"id":"doctrine","title":"Literatura técnica de manobra, navegação e meteorologia (princípios consolidados)","publisher":"diversos","edition":"indicar obra e edição do edital","official":false}],"rules":[{"id":"5","title":"Regra 5 - Vigilância","body":"Toda embarcação deve manter sempre vigilância visual e auditiva apropriada, e por todos os meios disponíveis adequados às circunstâncias, para avaliar plenamente a situação e o risco de colisão.\nEN: look-out; sight and hearing; all available means.\nArmadilha: vale em qualquer visibilidade; radar/AIS não substituem a vigia."},{"id":"6","title":"Regra 6 - Velocidade de segurança","body":"Navegar sempre a velocidade que permita ação apropriada e eficaz para evitar colisão e parar a distância adequada.\n(a) TODAS: (i) visibilidade; (ii) densidade de tráfego, incl. concentrações de pesqueiros; (iii) manobrabilidade, esp. distância de parada e giro; (iv) à noite, luz de fundo (costa, reflexo das próprias luzes); (v) vento, mar, corrente e perigos próximos; (vi) calado x profundidade.\n(b) ADEMAIS, com radar operando: (i) características, eficiência e limitações do radar; (ii) restrições da escala em uso; (iii) efeito do mar, tempo e interferências; (iv) pequenas embarcações, gelo e flutuantes podem não ser detectados; (v) número, posição e movimento dos alvos; (vi) avaliação mais exata da visibilidade.\nEN: safe speed; stopping distance; range scale.\nArmadilha: 6(b) só com radar; vale em qualquer visibilidade."},{"id":"7","title":"Regra 7 - Risco de colisão","body":"(a) Usar todos os meios disponíveis; havendo dúvida, o risco existe. (b) Radar: varredura em escala longa e plotagem ou observação sistemática equivalente. (c) Não presumir com informações escassas, especialmente de radar. (d)(i) Há risco se a marcação de bússola não variar apreciavelmente; (ii) pode haver risco mesmo com variação apreciável: navio muito grande, reboque ou pequena distância.\nEN: risk of collision; compass bearing; scanty information.\nArmadilha: marcação variando não garante segurança."},{"id":"8","title":"Regra 8 - Manobra para evitar colisão","body":"(a) Ação positiva, com antecedência e boa marinharia. (b) Alterações grandes o bastante para serem percebidas visualmente ou no radar; evitar pequenas alterações sucessivas. (c) Com espaço, a guinada isolada pode ser a ação mais eficaz, se feita a tempo, substancial e sem gerar nova situação de muita proximidade. (d) Passar a distância segura e verificar a eficácia. (e) Se preciso, reduzir ou tirar o seguimento. (f) Quem não deve impedir a passagem age cedo; a obrigação persiste com risco de colisão, e a outra continua obrigada às regras.\nEN: positive action; ample time; shall not impede.\nArmadilha: 'não impedir' difere de 'manter-se fora do caminho'."},{"id":"9","title":"Regra 9 - Canais estreitos","body":"(a) Navegar perto do limite exterior do canal a BORESTE, quando seguro e praticável. (b) < 20 m ou veleiro não deve impedir quem só navega com segurança dentro do canal. (c) Pesca não deve impedir qualquer embarcação no canal. (d) Não cruzar se impedir; em dúvida, sinal da 34(d). (e) Ultrapassagem com manobra da outra: sinais da 34(c). (f) Curva/obstrução: cautela e sinal da 34(e). (g) Evitar fundear no canal.\nEN: narrow channel; fairway.\nArmadilha: (b) e (c) são 'não impedir'."},{"id":"10","title":"Regra 10 - Esquemas de separação de tráfego","body":"Usar a via no sentido geral do fluxo; ficar fora da zona de separação; entrar/sair pelas extremidades ou com o menor ângulo possível. Evitar cruzar vias; se obrigado, com a PROA tão perpendicular ao fluxo quanto praticável. Zona costeira: só < 20 m, veleiros, pesca ou rumo a porto, instalação, estação de praticagem ou para evitar perigo. < 20 m e veleiros não impedem embarcação mecânica seguindo a via; pesca não impede embarcação na via.\nEN: TSS; traffic lane; inshore traffic zone.\nArmadilha: é a proa (heading), não o rumo no fundo."},{"id":"13","title":"Regra 13 - Ultrapassagem","body":"(a) Prevalece sobre as Seções I e II: quem ultrapassa manobra. (b) Ultrapassa quem se aproxima vindo de mais de 22,5 graus para ré do través: à noite veria só a luz de alcançado. (c) Em dúvida, considere-se ultrapassando. (d) Mudança posterior de marcação não a torna 'cruzando' nem a exime, até estar safa.\nEN: overtaking; abaft the beam; sternlight.\nArmadilha: vale também para veleiro ultrapassando navio a motor."},{"id":"14","title":"Regra 14 - Roda a roda","body":"(a) Duas embarcações de propulsão mecânica em rumos opostos ou quase, com risco: AMBAS guinam para BORESTE. (b) À noite: faróis de mastro alinhados ou quase e/ou ambas as luzes de bordo; de dia, aspecto correspondente. (c) Em dúvida, presume-se roda a roda.\nEN: head-on; reciprocal courses.\nArmadilha: só entre embarcações de propulsão mecânica."},{"id":"15","title":"Regra 15 - Rumos cruzados","body":"Duas embarcações de propulsão mecânica cruzando com risco: manobra a que tem a outra por BORESTE e, se possível, evita cruzar pela proa dela.\nEN: crossing situation; give-way vessel.\nArmadilha: veleiros entre si seguem a Regra 12."},{"id":"17","title":"Regra 17 - Embarcação que tem preferência","body":"(a)(i) A outra DEVE manter rumo e velocidade. (ii) PODE manobrar sozinha quando ficar evidente que a obrigada não age. (b) DEVE agir quando a colisão não puder ser evitada só pela outra. (c) Embarcação mecânica agindo pela (a)(ii), cruzando, não guina para bombordo para embarcação a seu bombordo, se possível. (d) Não exime a obrigada a manobrar.\nEN: stand-on vessel; shall/may take action.\nArmadilha: (a)(ii) = may; (b) = shall."},{"id":"18","title":"Regra 18 - Responsabilidades entre embarcações","body":"Salvo Regras 9, 10 e 13: (a) mecânica em movimento fica fora do caminho de: sem governo, manobra restrita, pesca, veleiro. (b) Veleiro: de sem governo, manobra restrita, pesca. (c) Pesca, se possível: de sem governo e manobra restrita. (d) Todas, exceto sem governo e manobra restrita, evitam impedir a restrita pelo calado (sinais da Regra 28), que navega com cuidado especial. (e) Hidroavião em geral se afasta de todas. (f) WIG fica bem safa ao decolar, pousar ou voar junto à superfície.\nEN: NUC; RAM; CBD.\nArmadilha: quem ultrapassa sempre manobra."},{"id":"19","title":"Regra 19 - Visibilidade restrita","body":"(a) Embarcações que não se avistam, em/perto de visibilidade restrita. (b) Velocidade segura; máquinas prontas. (d) Detectada só no radar: agir cedo; evitar (i) guinar para bombordo para embarcação a vante do través, salvo se ultrapassada; (ii) guinar na direção de embarcação pelo través ou para ré dele. (e) Salvo risco descartado, ao ouvir sinal de nevoeiro a vante do través, ou sem poder evitar muita proximidade: reduzir ao mínimo de governo, tirar o seguimento se preciso, extrema cautela.\nEN: restricted visibility; close-quarters.\nArmadilha: Seção II não se aplica a quem não se avista."},{"id":"27","title":"Regra 27 - Sem governo / manobra restrita","body":"Sem governo: duas circulares encarnadas em linha vertical; de dia, duas esferas; com seguimento, + luzes de bordo e alcançado. Manobra restrita: encarnada-branca-encarnada; de dia, esfera-losango-esfera; com seguimento + mastro, bordo, alcançado; fundeada + luzes de fundeio. Dragagem com obstrução: 2 encarnadas/2 esferas no lado obstruído, 2 verdes/2 losangos no lado livre. Remoção de minas: 3 verdes ou 3 esferas; perigoso aproximar-se a menos de 1000 m.\nEN: not under command; restricted in her ability to manoeuvre.\nArmadilha: não são sinais de socorro."},{"id":"34","title":"Regra 34 - Sinais de manobra e advertência","body":"À vista: 1 curto = guinando para boreste; 2 curtos = para bombordo; 3 curtos = máquinas a ré. Canal estreito: longo-longo-curto = ultrapassar por seu boreste; longo-longo-curto-curto = por seu bombordo; concordância: longo-curto-longo-curto. Dúvida: pelo menos 5 curtos e rápidos. Curva: 1 longo. Curto ~1 s; longo 4 a 6 s.\nEN: short blast; prolonged blast; doubt signal.\nArmadilha: 34(a) só entre embarcações à vista."},{"id":"35","title":"Regra 35 - Sinais em visibilidade restrita","body":"Intervalos de até 2 min: mecânica com seguimento 1 longo; parada sem seguimento 2 longos; sem governo, manobra restrita, restrita pelo calado, veleiro, pesca, rebocando/empurrando: 1 longo + 2 curtos; rebocada guarnecida: 1 longo + 3 curtos. Fundeada: sino rápido ~5 s a cada min (>= 100 m: sino a vante e gongo a ré). Encalhada: 3 badaladas + sino rápido + 3 badaladas. Praticagem: pode soar 4 curtos de identificação.\nEN: fog signals; prolonged blast.\nArmadilha: parada = 2 longos, não 1."}],"questions":[{"id":"R06-01","subject":"ripeam","topic":"Velocidade de segurança","rule":"6","ref":"RIPEAM Regra 6(b)(ii)","lang":"pt","difficulty":2,"question":"Pela Regra 6(b), qual fator deve ser considerado APENAS por embarcações que utilizam radar?","options":["O estado de visibilidade","As restrições impostas pela escala de distância do radar em uso","O calado em relação à profundidade disponível","A densidade do tráfego"],"answer":1,"explanation":"A 6(b)(ii) aplica-se a embarcações com radar em funcionamento. Visibilidade é 6(a)(i), densidade de tráfego 6(a)(ii) e calado x profundidade 6(a)(vi): constam da 6(a), válida para TODAS as embarcações.","status":"reviewed","source":"colreg","tags":["shall","radar"]},{"id":"R06-02","subject":"ripeam","topic":"Velocidade de segurança","rule":"6","ref":"RIPEAM Regras 4 e 6","lang":"pt","difficulty":1,"question":"A obrigação de navegar a velocidade de segurança (Regra 6) aplica-se:","options":["Somente em visibilidade restrita","A todas as embarcações, em qualquer condição de visibilidade","Apenas a embarcações de propulsão mecânica","Somente em canais estreitos e esquemas de tráfego"],"answer":1,"explanation":"A Regra 6 está na Seção I da Parte B, que pela Regra 4 se aplica em qualquer condição de visibilidade, e começa com 'toda embarcação'. Não é restrita à visibilidade reduzida (Regra 19), nem a um tipo de embarcação ou área.","status":"reviewed","source":"colreg","tags":[]},{"id":"R07-01","subject":"ripeam","topic":"Risco de colisão","rule":"7","ref":"RIPEAM Regra 7(d)(i)","lang":"pt","difficulty":2,"question":"Pela Regra 7, se a marcação de bússola de uma embarcação que se aproxima não varia apreciavelmente:","options":["Fica provado que não há risco de colisão","Deve-se considerar que existe risco de colisão","Isso só importa em visibilidade restrita","Isso só se aplica a navios de grande porte"],"answer":1,"explanation":"7(d)(i): considera-se que existe risco se a marcação de bússola não variar apreciavelmente. A regra vale em qualquer visibilidade e para qualquer embarcação. O contrário também não é garantia: ver 7(d)(ii).","status":"reviewed","source":"colreg","tags":["shall"]},{"id":"R07-02","subject":"ripeam","topic":"Risk of collision","rule":"7","ref":"COLREG Rule 7(d)(ii)","lang":"en","difficulty":4,"question":"Rule 7(d)(ii): risk of collision may exist even when an appreciable bearing change is evident, particularly when approaching:","options":["A vessel at anchor","A very large vessel, a tow, or a vessel at close range","A vessel showing only a sternlight","A sailing vessel running free"],"answer":1,"explanation":"Rule 7(d)(ii) names a very large vessel, a tow, or a vessel at close range: bearings to different parts of a long target change differently. The other options are not mentioned in Rule 7.","status":"reviewed","source":"colreg","tags":["trap"]},{"id":"R07-03","subject":"ripeam","topic":"Risco de colisão","rule":"7","ref":"RIPEAM Regra 7(c)","lang":"pt","difficulty":3,"question":"Pela Regra 7(c), presunções baseadas em informações escassas, especialmente informações radar escassas:","options":["São aceitáveis em escala longa","Não devem ser feitas","São permitidas em mar aberto","Devem apenas ser registradas no diário"],"answer":1,"explanation":"7(c): 'assumptions shall not be made on the basis of scanty information, especially scanty radar information'. É uma proibição (shall not), sem exceção por escala, área ou registro.","status":"reviewed","source":"colreg","tags":["shall"]},{"id":"R13-01","subject":"ripeam","topic":"Ultrapassagem","rule":"13","ref":"RIPEAM Regra 13(b)","lang":"pt","difficulty":2,"question":"Está ultrapassando a embarcação que se aproxima de outra vindo de direção a mais de quantos graus para ré do través desta?","options":["10 graus","22,5 graus","45 graus","67,5 graus"],"answer":1,"explanation":"13(b): mais de 22,5 graus para ré do través; à noite, veria só a luz de alcançado (setor de 135 graus, 67,5 para cada bordo a partir da popa) e nenhuma luz de bordo. 67,5 é a metade do setor da luz de alcançado, não o limite de ultrapassagem.","status":"reviewed","source":"colreg","tags":["numbers"]},{"id":"R13-02","subject":"ripeam","topic":"Ultrapassagem","rule":"13","ref":"RIPEAM Regra 13(d)","lang":"pt","difficulty":4,"question":"Configurada a ultrapassagem, a marcação muda e a ultrapassadora fica a menos de 22,5 graus para ré do través da outra. Pela Regra 13(d):","options":["Passa a ser situação de rumos cruzados (Regra 15)","Continua ultrapassadora até ter passado e estar safa","A embarcação ultrapassada passa a manobrar","Ambas devem guinar para boreste"],"answer":1,"explanation":"13(d): qualquer alteração posterior da marcação não torna a ultrapassadora uma embarcação cruzando nem a exime de manter-se fora do caminho até ter passado e estar safa. A ultrapassada mantém rumo e velocidade (Regra 17).","status":"reviewed","source":"colreg","tags":["trap"]},{"id":"R14-01","subject":"ripeam","topic":"Roda a roda","rule":"14","ref":"RIPEAM Regra 14(a)","lang":"pt","difficulty":1,"question":"Em situação de roda a roda com risco de colisão, duas embarcações de propulsão mecânica devem:","options":["Guinar ambas para bombordo","Guinar ambas para boreste","A menor manobra e a maior mantém","Reduzir a velocidade e manter o rumo"],"answer":1,"explanation":"14(a): cada uma guina para boreste, passando bombordo com bombordo. Não há hierarquia por tamanho; reduzir mantendo o rumo não é a ação prescrita.","status":"reviewed","source":"colreg","tags":[]},{"id":"R15-01","subject":"ripeam","topic":"Rumos cruzados","rule":"15","ref":"RIPEAM Regra 15","lang":"pt","difficulty":1,"question":"Em rumos cruzados com risco de colisão entre embarcações de propulsão mecânica, deve manobrar a que:","options":["Tem a outra por boreste","Tem a outra por bombordo","For a maior","For a mais rápida"],"answer":0,"explanation":"Regra 15: manobra a que tem a outra por boreste e, se as circunstâncias permitirem, evita cruzar pela proa dela. Tamanho e velocidade não definem a obrigação.","status":"reviewed","source":"colreg","tags":[]},{"id":"R17-01","subject":"ripeam","topic":"Embarcação com preferência","rule":"17","ref":"RIPEAM Regra 17(c)","lang":"pt","difficulty":3,"question":"Pela Regra 17(c), embarcação de propulsão mecânica que manobra com base na 17(a)(ii), em rumos cruzados, deve, se possível:","options":["Guinar para bombordo para embarcação a seu bombordo","Não guinar para bombordo para embarcação a seu bombordo","Parar as máquinas antes de qualquer guinada","Soar cinco apitos curtos antes de guinar"],"answer":1,"explanation":"17(c): não deve, se as circunstâncias permitirem, alterar o rumo para bombordo para embarcação a seu próprio bombordo (guinaria para a obrigada, que tende a guinar para boreste). Parar máquinas ou sinal de dúvida não são exigências da 17(c).","status":"reviewed","source":"colreg","tags":["shall"]},{"id":"R17-02","subject":"ripeam","topic":"Embarcação com preferência","rule":"17","ref":"RIPEAM Regra 17(a)(ii) e (b)","lang":"pt","difficulty":3,"question":"A embarcação que tem preferência DEVE (shall) agir quando:","options":["Achar que a outra está demorando a manobrar","Estiver tão próxima que a colisão não possa ser evitada só pela manobra da outra","A outra soar um apito curto","Houver qualquer risco de colisão"],"answer":1,"explanation":"17(b) usa 'shall': quando a colisão não pode ser evitada apenas pela ação da obrigada a manobrar. Agir quando a outra não manobra adequadamente é a 17(a)(ii), que usa 'may' (pode). Com risco, a regra geral é manter rumo e velocidade.","status":"reviewed","source":"colreg","tags":["shall","may","trap"]},{"id":"R18-01","subject":"ripeam","topic":"Responsabilidades","rule":"18","ref":"RIPEAM Regras 13 e 18(a)","lang":"pt","difficulty":3,"question":"Uma embarcação de propulsão mecânica em movimento deve manter-se fora do caminho de todas as seguintes, EXCETO:","options":["Embarcação sem governo","Embarcação com capacidade de manobra restrita","Embarcação engajada na pesca","Embarcação de propulsão mecânica que a está ultrapassando"],"answer":3,"explanation":"A Regra 18 começa 'salvo quando as Regras 9, 10 e 13 dispuserem de outro modo': quem ultrapassa é que se mantém fora do caminho (Regra 13). Sem governo, manobra restrita e pesca constam da 18(a).","status":"reviewed","source":"colreg","tags":["trap"]},{"id":"R19-01","subject":"ripeam","topic":"Visibilidade restrita","rule":"19","ref":"RIPEAM Regra 19(d)(i)","lang":"pt","difficulty":4,"question":"Pela Regra 19(d), detectada SOMENTE pelo radar uma embarcação a vante do través, se houver alteração de rumo deve-se evitar, tanto quanto possível:","options":["Guinar para boreste","Guinar para bombordo, exceto se ela estiver sendo ultrapassada","Reduzir a velocidade","Qualquer alteração de rumo"],"answer":1,"explanation":"19(d)(i): evitar guinar para bombordo para embarcação a vante do través, salvo a que está sendo ultrapassada; 19(d)(ii): evitar guinar na direção de embarcação pelo través ou para ré dele. Reduzir a velocidade é admitido (Regras 8(e) e 19(e)).","status":"reviewed","source":"colreg","tags":["trap"]},{"id":"R19-02","subject":"ripeam","topic":"Visibilidade restrita","rule":"19","ref":"RIPEAM Regra 19(e)","lang":"pt","difficulty":3,"question":"Pela Regra 19(e), ao ouvir sinal de nevoeiro aparentemente a vante do través, sem ter determinado que não há risco, a embarcação deve:","options":["Guinar imediatamente para boreste","Reduzir a velocidade ao mínimo em que possa manter o governo","Parar e fundear","Soar cinco apitos curtos"],"answer":1,"explanation":"19(e): reduzir ao mínimo de governo e, se necessário, tirar todo o seguimento, navegando com extrema cautela até passar o perigo. Fundear não é exigido; 5 curtos é sinal entre embarcações à vista (34(d)).","status":"reviewed","source":"colreg","tags":["shall"]},{"id":"R21-01","subject":"ripeam","topic":"Luzes - definições","rule":"21","ref":"RIPEAM Regra 21(a)","lang":"pt","difficulty":2,"question":"Qual o setor de visibilidade do farol de mastro (Regra 21)?","options":["112,5 graus","135 graus","225 graus","360 graus"],"answer":2,"explanation":"Farol de mastro: 225 graus, da proa até 22,5 graus para ré do través em cada bordo. Luz de bordo: 112,5; luz de alcançado: 135; luz circular: 360.","status":"reviewed","source":"colreg","tags":["numbers"]},{"id":"R21-02","subject":"ripeam","topic":"Lights - definitions","rule":"21","ref":"COLREG Rule 21(f)","lang":"en","difficulty":2,"question":"Under Rule 21, a 'flashing light' means a light flashing at regular intervals at a frequency of:","options":["60 flashes per minute or more","120 flashes or more per minute","Exactly 50 flashes per minute","Not more than 30 flashes per minute"],"answer":1,"explanation":"Rule 21(f): 'Flashing light' means a light flashing at regular intervals at a frequency of 120 flashes or more per minute. The other figures do not appear in Rule 21.","status":"reviewed","source":"colreg","tags":["numbers"]},{"id":"R22-01","subject":"ripeam","topic":"Alcance das luzes","rule":"22","ref":"RIPEAM Regra 22(a)","lang":"pt","difficulty":3,"question":"Alcance mínimo do farol de mastro de embarcação com 50 m ou mais de comprimento (Regra 22):","options":["3 milhas","5 milhas","6 milhas","2 milhas"],"answer":2,"explanation":"22(a), >= 50 m: mastro 6 milhas; bordo, alcançado, reboque e circulares 3. Entre 12 e 50 m: mastro 5 (3 se < 20 m), demais 2. < 12 m: mastro 2, bordo 1, demais 2.","status":"reviewed","source":"colreg","tags":["numbers"]},{"id":"R23-01","subject":"ripeam","topic":"Embarcação de propulsão mecânica","rule":"23","ref":"RIPEAM Regra 23(a)","lang":"pt","difficulty":2,"question":"Embarcação de propulsão mecânica em movimento, com 50 m ou mais, deve exibir:","options":["Um farol de mastro, luzes de bordo e alcançado","Dois faróis de mastro, o de ré mais alto, luzes de bordo e alcançado","Dois faróis de mastro, o de vante mais alto, e luzes de bordo","Três faróis de mastro em linha vertical"],"answer":1,"explanation":"23(a): farol de mastro a vante, segundo farol de mastro por ante a ré e mais alto, luzes de bordo e luz de alcançado. Com menos de 50 m o segundo é facultativo. Três em linha vertical é reboque > 200 m.","status":"reviewed","source":"colreg","tags":[]},{"id":"R24-01","subject":"ripeam","topic":"Reboque","rule":"24","ref":"RIPEAM Regra 24(a)","lang":"pt","difficulty":3,"question":"Rebocador de propulsão mecânica cujo reboque excede 200 m exibe, em vez do farol de mastro de vante:","options":["Dois faróis de mastro em linha vertical","Três faróis de mastro em linha vertical","Duas luzes circulares encarnadas","Uma luz circular amarela"],"answer":1,"explanation":"24(a): três faróis de mastro em linha vertical quando o comprimento do reboque, da popa do rebocador ao extremo de ré do reboque, excede 200 m (dois se não excede), mais losango onde melhor puder ser visto. Também luz de reboque amarela acima da de alcançado.","status":"reviewed","source":"colreg","tags":["numbers"]},{"id":"R26-01","subject":"ripeam","topic":"Pesca","rule":"26","ref":"RIPEAM Regra 26(b)","lang":"pt","difficulty":2,"fig":"L:GW","question":"As luzes circulares da figura, verde sobre branca, em linha vertical, indicam embarcação:","options":["Engajada em pesca de arrasto","Engajada em pesca que não de arrasto","De praticagem em serviço","Sem governo"],"answer":0,"explanation":"Arrasto: verde sobre branca. Pesca que não de arrasto: encarnada sobre branca. Praticagem: branca sobre encarnada. Sem governo: duas encarnadas. Com seguimento, somam-se luzes de bordo e alcançado.","status":"reviewed","source":"colreg","tags":["lights"]},{"id":"R26-02","subject":"ripeam","topic":"Pesca","rule":"26","ref":"RIPEAM Regra 26(c)(ii)","lang":"pt","difficulty":3,"question":"Pesqueiro (exceto arrasto) com aparelho estendido a mais de 150 m na horizontal indica a direção do aparelho com:","options":["Luz circular branca ou cone com vértice para cima","Luz circular verde ou cilindro","Duas luzes encarnadas ou duas esferas","Luz amarela ou cone com vértice para baixo"],"answer":0,"explanation":"26(c)(ii): luz circular branca ou cone com o vértice para cima, na direção do aparelho. Cilindro = restrita pelo calado; duas encarnadas/esferas = sem governo; cone com vértice para baixo = veleiro também a motor.","status":"reviewed","source":"colreg","tags":["numbers","shapes"]},{"id":"R27-01","subject":"ripeam","topic":"Manobra restrita","rule":"27","ref":"RIPEAM Regra 27(b)","lang":"pt","difficulty":1,"fig":"L:RWR","question":"Três luzes circulares em linha vertical, encarnada, branca e encarnada (figura), indicam embarcação:","options":["Sem governo","Com capacidade de manobra restrita","Restrita pelo seu calado","Encalhada"],"answer":1,"explanation":"Manobra restrita: encarnada-branca-encarnada; de dia, esfera-losango-esfera. Sem governo: duas encarnadas. Restrita pelo calado: três encarnadas. Encalhada: luzes de fundeio + duas encarnadas.","status":"reviewed","source":"colreg","tags":["lights"]},{"id":"R27-02","subject":"ripeam","topic":"Sem governo","rule":"27","ref":"RIPEAM Regra 27(a)","lang":"pt","difficulty":1,"fig":"L:RR","question":"Duas luzes circulares encarnadas em linha vertical, sem luzes de bordo (figura), indicam embarcação:","options":["Sem governo, sem seguimento","Restrita pelo seu calado","Engajada na pesca","Fundeada"],"answer":0,"explanation":"27(a): sem governo exibe duas circulares encarnadas; com seguimento acrescenta luzes de bordo e alcançado. De dia, duas esferas. Restrita pelo calado usa três encarnadas; fundeada, luzes brancas.","status":"reviewed","source":"colreg","tags":["lights"]},{"id":"R27-03","subject":"ripeam","topic":"Remoção de minas","rule":"27","ref":"RIPEAM Regra 27(f)","lang":"pt","difficulty":4,"question":"Embarcação em remoção de minas exibe três luzes verdes ou três esferas, indicando ser perigoso aproximar-se a menos de:","options":["500 m","1000 m","1 milha","200 m"],"answer":1,"explanation":"27(f): uma luz/esfera no tope do mastro de vante e uma em cada lais da verga; indicam perigo em aproximar-se a menos de 1000 m. Três esferas em linha vertical, por outro lado, indicam encalhe (Regra 30).","status":"reviewed","source":"colreg","tags":["numbers","trap"]},{"id":"R28-01","subject":"ripeam","topic":"Restrita pelo calado","rule":"28","ref":"RIPEAM Regra 28","lang":"pt","difficulty":2,"fig":"S:C","question":"A marca da figura (cilindro) pode ser exibida, de dia, por embarcação:","options":["Restrita pelo seu calado","Sem governo","Rebocando","Fundeada"],"answer":0,"explanation":"Regra 28: restrita pelo calado PODE (may) exibir três luzes circulares encarnadas ou um cilindro. Sem governo: duas esferas; reboque > 200 m: losango; fundeada: uma esfera. Note o 'pode'.","status":"reviewed","source":"colreg","tags":["may","shapes"]},{"id":"R29-01","subject":"ripeam","topic":"Praticagem","rule":"29","ref":"RIPEAM Regra 29(a)","lang":"pt","difficulty":1,"fig":"L:WR","question":"Duas luzes circulares no tope, branca sobre encarnada (figura), indicam embarcação:","options":["De praticagem em serviço","Engajada em pesca que não de arrasto","Sem governo","Engajada em pesca de arrasto"],"answer":0,"explanation":"29(a): praticagem em serviço: branca sobre encarnada; em movimento + bordo e alcançado; fundeada + luzes de fundeio. Encarnada sobre branca é pesca (não arrasto); verde sobre branca, arrasto.","status":"reviewed","source":"colreg","tags":["lights","pilotage"]},{"id":"R30-01","subject":"ripeam","topic":"Fundeio","rule":"30","ref":"RIPEAM Regra 30","lang":"pt","difficulty":2,"question":"Embarcação fundeada exibe, de dia:","options":["Uma esfera na parte de vante","Duas esferas em linha vertical","Três esferas em linha vertical","Um cone com vértice para baixo"],"answer":0,"explanation":"30(a): uma esfera a vante. Duas esferas = sem governo; três esferas = encalhada (30(d)); cone com vértice para baixo = veleiro também a motor. À noite: luz circular branca a vante e outra mais baixa a ré (< 50 m: pode ser uma); >= 100 m ilumina o convés.","status":"reviewed","source":"colreg","tags":["shapes"]},{"id":"R34-01","subject":"ripeam","topic":"Sinais sonoros","rule":"34","ref":"RIPEAM Regra 34(a)","lang":"pt","difficulty":1,"question":"Entre embarcações à vista, três apitos curtos significam:","options":["Estou guinando para boreste","Estou guinando para bombordo","Estou dando máquinas a ré","Tenho dúvida sobre suas intenções"],"answer":2,"explanation":"34(a): 1 curto = boreste; 2 curtos = bombordo; 3 curtos = máquinas a ré. Dúvida: pelo menos 5 curtos e rápidos (34(d)).","status":"reviewed","source":"colreg","tags":["sound"]},{"id":"R34-02","subject":"ripeam","topic":"Sinais sonoros","rule":"34","ref":"RIPEAM Regra 34(c)(i)","lang":"pt","difficulty":3,"question":"Em canal estreito, o sinal 'longo, longo, curto, curto' significa:","options":["Pretendo ultrapassá-lo por seu boreste","Pretendo ultrapassá-lo por seu bombordo","Concordo com a ultrapassagem","Aproximo-me de uma curva"],"answer":1,"explanation":"34(c)(i): longo-longo-curto = por seu boreste; longo-longo-curto-curto = por seu bombordo. Concordância 34(c)(ii): longo-curto-longo-curto. Curva 34(e): um longo.","status":"reviewed","source":"colreg","tags":["sound","trap"]},{"id":"R35-01","subject":"ripeam","topic":"Sinais em visibilidade restrita","rule":"35","ref":"RIPEAM Regra 35(a) e (b)","lang":"pt","difficulty":2,"question":"Em visibilidade restrita, embarcação de propulsão mecânica com seguimento soa, a intervalos de até 2 minutos:","options":["Um apito longo","Dois apitos longos","Um longo e dois curtos","Quatro apitos curtos"],"answer":0,"explanation":"35(a): um longo. Parada sem seguimento: dois longos (35(b)). Um longo + dois curtos: sem governo, manobra restrita, calado, veleiro, pesca, reboque (35(c)). Quatro curtos: identificação de praticagem (35(i)).","status":"reviewed","source":"colreg","tags":["sound"]},{"id":"R35-02","subject":"ripeam","topic":"Fog signals","rule":"35","ref":"COLREG Rule 35(e)","lang":"en","difficulty":4,"question":"In restricted visibility, a vessel towed (or the last vessel of the tow), if manned, shall sound:","options":["One prolonged and two short blasts","One prolonged followed by three short blasts","Two prolonged blasts","Rapid ringing of the bell for about 5 seconds"],"answer":1,"explanation":"Rule 35(e): one prolonged followed by three short blasts, when practicable immediately after the towing vessel's signal. One prolonged + two short is the towing vessel; two prolonged is stopped; the bell is at anchor.","status":"reviewed","source":"colreg","tags":["sound"]},{"id":"R03-01","subject":"ripeam","topic":"Definitions","rule":"3","ref":"COLREG Rule 3(b),(c)","lang":"en","difficulty":1,"question":"Under Rule 3, a sailing vessel under sail with propelling machinery being used is:","options":["A sailing vessel","A power-driven vessel","A vessel restricted in her ability to manoeuvre","A vessel not under command"],"answer":1,"explanation":"Rule 3(c): 'sailing vessel' means any vessel under sail provided that propelling machinery, if fitted, is not being used. With machinery in use it is a power-driven vessel (3(b)) and, by day, shows a cone apex downwards (25(e)).","status":"reviewed","source":"colreg","tags":["definitions"]},{"id":"R09-01","subject":"ripeam","topic":"Canais estreitos","rule":"9","ref":"RIPEAM Regra 9(b)","lang":"pt","difficulty":3,"question":"Pela Regra 9(b), uma embarcação de menos de 20 m ou um veleiro, em canal estreito:","options":["Tem preferência sobre navios mercantes","Não deve impedir a passagem de embarcação que só pode navegar com segurança dentro do canal","Deve fundear ao avistar navio de grande porte","Não pode cruzar o canal em hipótese alguma"],"answer":1,"explanation":"9(b): 'shall not impede'. Não há preferência por tipo nem obrigação de fundear; cruzar é vedado apenas se impedir a passagem (9(d)). 'Não impedir' difere de 'manter-se fora do caminho' (ver 8(f)).","status":"reviewed","source":"colreg","tags":["shall","trap"]},{"id":"R10-01","subject":"ripeam","topic":"Separação de tráfego","rule":"10","ref":"RIPEAM Regra 10(c)","lang":"pt","difficulty":2,"question":"Em esquema de separação de tráfego, a embarcação obrigada a cruzar uma via de tráfego deve fazê-lo:","options":["Com ângulo de 45 graus em relação ao fluxo","Com a proa tão perpendicular quanto praticável à direção geral do fluxo","Somente pelas extremidades do esquema","Sempre com velocidade máxima"],"answer":1,"explanation":"10(c): 'on a heading as nearly as practicable at right angles to the general direction of traffic flow'. Vale a PROA, não o rumo no fundo. Entrar pelas extremidades é a regra para quem vai USAR a via (10(b)(iii)).","status":"reviewed","source":"colreg","tags":["trap"]},{"id":"FIG-01","subject":"ripeam","topic":"Marcas","rule":"27","ref":"RIPEAM Regra 27(b)(ii)","lang":"pt","difficulty":1,"fig":"S:BDB","question":"De dia, a embarcação exibe as marcas da figura (esfera, losango, esfera). Ela está:","options":["Com capacidade de manobra restrita","Sem governo","Rebocando com reboque > 200 m","Encalhada"],"answer":0,"explanation":"27(b)(ii): esfera-losango-esfera = manobra restrita. Sem governo: duas esferas. Reboque > 200 m: um losango. Encalhada: três esferas.","status":"reviewed","source":"colreg","tags":["shapes"]},{"id":"FIG-02","subject":"ripeam","topic":"Marcas","rule":"26","ref":"RIPEAM Regra 26","lang":"pt","difficulty":2,"fig":"S:X","question":"A marca da figura (dois cones unidos pelos vértices, em linha vertical) indica embarcação:","options":["Engajada na pesca","Rebocando","A vela, também usando máquinas","Fundeada"],"answer":0,"explanation":"Regra 26: dois cones com vértices unidos = engajada na pesca (< 20 m pode usar um cesto). Rebocando: losango. Veleiro a motor: um cone com vértice para baixo. Fundeada: esfera.","status":"reviewed","source":"colreg","tags":["shapes"]},{"id":"FIG-03","subject":"ripeam","topic":"Restrita pelo calado","rule":"28","ref":"RIPEAM Regra 28","lang":"pt","difficulty":1,"fig":"L:RRR","question":"Além das luzes de embarcação de propulsão mecânica, três circulares encarnadas em linha vertical (figura) indicam:","options":["Restrita pelo seu calado","Sem governo","Manobra restrita","Encalhada"],"answer":0,"explanation":"Regra 28: três encarnadas ou cilindro (facultativo: 'may'). Sem governo: duas encarnadas. Manobra restrita: encarnada-branca-encarnada. Encalhada: fundeio + duas encarnadas.","status":"reviewed","source":"colreg","tags":["lights","may"]},{"id":"FIG-04","subject":"ripeam","topic":"Encalhe","rule":"30","ref":"RIPEAM Regra 30(d)","lang":"pt","difficulty":1,"fig":"S:BBB","question":"Três esferas em linha vertical (figura) indicam embarcação:","options":["Encalhada","Sem governo","Em remoção de minas","Fundeada"],"answer":0,"explanation":"30(d)(ii): encalhada, três esferas em linha vertical. Sem governo: duas esferas. Remoção de minas: três esferas, mas uma no mastro e uma em cada lais (não em linha vertical). Fundeada: uma esfera.","status":"reviewed","source":"colreg","tags":["shapes","trap"]},{"id":"FIG-05","subject":"ripeam","topic":"Veleiro a motor","rule":"25","ref":"RIPEAM Regra 25(e)","lang":"pt","difficulty":2,"fig":"S:N","question":"Um cone com o vértice para baixo, a vante (figura), indica:","options":["Embarcação a vela também propelida por máquinas","Pesca com aparelho a mais de 150 m","Embarcação restrita pelo calado","Embarcação fundeada"],"answer":0,"explanation":"25(e): a vela e também usando máquinas, cone com vértice para baixo. Aparelho > 150 m: cone com vértice para CIMA. Calado: cilindro. Fundeada: esfera.","status":"reviewed","source":"colreg","tags":["shapes","trap"]},{"id":"AN-01","subject":"arte","topic":"Linhas de carga","ref":"Convenção de Linhas de Carga 1966","lang":"pt","difficulty":1,"question":"Na marca de borda livre, qual linha corresponde ao MAIOR calado permitido?","options":["W - Inverno","S - Verão","TF - Tropical em água doce","WNA - Inverno no Atlântico Norte"],"answer":2,"explanation":"De cima para baixo: TF, F, T, S, W, WNA. A de água doce tropical é a mais alta (maior calado) pela menor densidade e condições tropicais. WNA é a mais baixa. As letras podem variar conforme a Administração.","status":"reviewed","source":"ll66","tags":[]},{"id":"AN-02","subject":"arte","topic":"Nomenclatura","ref":"Arte Naval - nomenclatura","lang":"pt","difficulty":1,"question":"A distância vertical, a meio navio, da linha d'água até a face superior do convés de borda livre denomina-se:","options":["Calado","Borda livre","Pontal","Tosamento"],"answer":1,"explanation":"Borda livre: da linha d'água ao convés de borda livre. Calado: da quilha à linha d'água. Pontal: da quilha ao convés. Tosamento: curvatura longitudinal do convés.","status":"reviewed","source":"doctrine","tags":[]},{"id":"NAV-01","subject":"nav","topic":"Balizamento","ref":"IALA Região B","lang":"pt","difficulty":1,"question":"Entrando em porto no Brasil (IALA Região B), no sentido convencional do balizamento, a marca lateral de BORESTE é:","options":["Encarnada","Verde","Amarela","Preta e amarela"],"answer":0,"explanation":"Na Região B (Américas, Japão, Coreia, Filipinas) a lateral de boreste é encarnada e a de bombordo verde; na Região A é o inverso. Amarela: marca especial; preta e amarela: cardinal.","status":"reviewed","source":"iala","tags":[]},{"id":"NAV-02","subject":"nav","topic":"Balizamento","ref":"IALA - marcas cardinais","lang":"pt","difficulty":2,"question":"Marca cardinal com tope de dois cones pretos com os vértices para baixo é a cardinal:","options":["Norte","Sul","Leste","Oeste"],"answer":1,"explanation":"Norte: ambos os vértices para cima. Sul: ambos para baixo. Leste: bases unidas (vértices opostos). Oeste: vértices unidos. A marca indica que as águas seguras ficam no quadrante do seu nome.","status":"reviewed","source":"iala","tags":[]},{"id":"NAV-03","subject":"nav","topic":"Agulha magnética","ref":"Navegação - conversão de rumos","lang":"pt","difficulty":2,"question":"Rumo magnético 040, declinação magnética 20 W. O rumo verdadeiro é:","options":["060","020","040","220"],"answer":1,"explanation":"Do magnético para o verdadeiro: declinação E soma, W subtrai. 040 - 20 = 020 verdadeiro. 060 seria aplicar o sinal invertido.","status":"reviewed","source":"doctrine","tags":["calc"]},{"id":"NAV-04","subject":"nav","topic":"Unidades","ref":"Milha náutica internacional","lang":"pt","difficulty":1,"question":"Uma milha náutica internacional equivale a:","options":["1609 m","1852 m","1000 m","1828 m"],"answer":1,"explanation":"Milha náutica internacional: 1852 m (aprox. 1 minuto de latitude). 1609 m é a milha terrestre. Nó = 1 milha náutica por hora.","status":"reviewed","source":"doctrine","tags":[]},{"id":"MAN-01","subject":"manobra","topic":"Efeito do hélice","ref":"Manobra - pressão lateral das pás","lang":"pt","difficulty":2,"question":"Navio de hélice único, passo fixo, rotação à direita, dando atrás a partir do repouso: a popa tende a cair para:","options":["Boreste","Bombordo","Não há tendência","Depende apenas do leme"],"answer":1,"explanation":"Com máquinas a ré o hélice de passo direito gira no sentido anti-horário (visto de ré) e a popa cai para BOMBORDO (proa para boreste). Dando adiante, a tendência é a popa para boreste, mais fraca. O leme é pouco eficaz dando atrás a partir do repouso.","status":"reviewed","source":"doctrine","tags":[]},{"id":"MAN-02","subject":"manobra","topic":"Squat","ref":"Manobra - águas rasas","lang":"pt","difficulty":2,"question":"Sobre o squat (afundamento dinâmico):","options":["Diminui em águas rasas","Aumenta com a velocidade, aprox. com o quadrado dela, e é maior em águas rasas e canais","Independe da velocidade","Só ocorre em navios com trim pela popa"],"answer":1,"explanation":"O squat cresce aproximadamente com o quadrado da velocidade e é agravado por águas rasas e pelo fator de bloqueio do canal. Reduzir a velocidade é a forma mais eficaz de reduzi-lo. Ocorre com qualquer trim.","status":"reviewed","source":"doctrine","tags":[]},{"id":"MAN-03","subject":"manobra","topic":"Efeito de margem","ref":"Manobra - interação com margens","lang":"pt","difficulty":3,"question":"Navegando próximo e paralelo à margem de um canal, o efeito de margem tende a:","options":["Atrair a proa para a margem","Atrair a popa para a margem e afastar a proa","Afastar o navio inteiro da margem","Desaparecer em águas rasas"],"answer":1,"explanation":"Sucção na popa (bank suction) e almofada na proa (bank cushion): a proa tende a afastar-se e a popa a ser atraída. Aumenta com velocidade, menor profundidade e menor distância à margem; corrige-se com leme para o lado da margem.","status":"reviewed","source":"doctrine","tags":[]},{"id":"MET-01","subject":"meteo","topic":"Lei de Buys Ballot","ref":"Meteorologia - Buys Ballot","lang":"pt","difficulty":2,"question":"No Hemisfério Sul, de costas para o vento, o centro de baixa pressão fica:","options":["À esquerda do observador","À direita do observador","À frente do observador","Às costas do observador"],"answer":1,"explanation":"Hemisfério Sul: baixa à DIREITA (circulação horária em torno da baixa; Coriolis desvia para a esquerda). Hemisfério Norte: baixa à esquerda.","status":"reviewed","source":"doctrine","tags":[]},{"id":"MET-02","subject":"meteo","topic":"Escala Beaufort","ref":"Escala Beaufort","lang":"pt","difficulty":2,"question":"Na escala Beaufort, força 8 corresponde aproximadamente a:","options":["17 a 21 nós","34 a 40 nós","48 a 55 nós","64 nós ou mais"],"answer":1,"explanation":"Força 8 (gale): 34 a 40 nós. Força 5: 17 a 21; força 10: 48 a 55; força 12: 64 ou mais.","status":"reviewed","source":"doctrine","tags":["numbers"]},{"id":"MET-03","subject":"meteo","topic":"Ciclones tropicais","ref":"Meteorologia - ciclones tropicais","lang":"pt","difficulty":3,"question":"No Hemisfério Sul, o semicírculo perigoso de um ciclone tropical, em relação à trajetória, é o:","options":["Semicírculo direito","Semicírculo esquerdo","Semicírculo anterior","Não há semicírculo perigoso"],"answer":1,"explanation":"No HS a rotação é horária: no semicírculo ESQUERDO o vento soma-se ao deslocamento e tende a levar o navio para a trajetória. No HN é o direito.","status":"reviewed","source":"doctrine","tags":["trap"]},{"id":"CONV-01","subject":"conv","topic":"MARPOL","ref":"MARPOL 73/78, Anexos","lang":"pt","difficulty":1,"question":"O Anexo VI da MARPOL trata de:","options":["Poluição por óleo","Lixo","Poluição do ar por navios","Esgoto"],"answer":2,"explanation":"Anexos MARPOL: I óleo; II substâncias líquidas nocivas a granel; III substâncias nocivas embaladas; IV esgoto; V lixo; VI poluição do ar.","status":"reviewed","source":"marpol","tags":[]}],"oral":[{"id":"O-27","rule":"27","prompt":"Explique luzes, marcas e obrigações de uma embarcação com capacidade de manobra restrita.","reference":"Luzes encarnada-branca-encarnada em linha vertical; com seguimento, + mastro, bordo e alcançado; fundeada, + fundeio. De dia esfera-losango-esfera. Restrita pela natureza do trabalho (Regra 3(g)). Pela Regra 18, mecânicas, veleiros e pesqueiros mantêm-se fora do seu caminho. Nevoeiro: 1 longo + 2 curtos.","keypoints":[{"label":"Luzes encarnada-branca-encarnada","all":[["encarnad","vermelh","red"],["branc","white"]]},{"label":"Marcas esfera-losango-esfera","all":[["esfera","bola","ball"],["losango","diamond"]]},{"label":"Luzes adicionais com seguimento ou fundeada","all":[["seguimento","movimento","fundead","making way"]]},{"label":"Natureza do trabalho limita a manobra (Regra 3)","all":[["natureza","trabalho","work"]]},{"label":"Outras mantêm-se fora do caminho (Regra 18)","all":[["fora do caminho","18","keep out"]]},{"label":"Nevoeiro: um longo e dois curtos","all":[["longo","prolonged"],["dois curtos","two short","2 curtos"]]}],"misconceptions":[{"label":"Confundiu com sem governo (duas encarnadas / duas esferas)","any":["duas esferas","duas luzes encarnadas","two balls"]}]},{"id":"O-06","rule":"6","prompt":"Enumere os fatores da Regra 6 para todas as embarcações e os adicionais para quem usa radar.","reference":"6(a): visibilidade; densidade de tráfego incl. pesqueiros; manobrabilidade (parada e giro); à noite luz de fundo; vento, mar, corrente e perigos; calado x profundidade. 6(b) com radar: limitações do radar; escala em uso; efeito do mar e tempo; alvos pequenos e gelo não detectados; número, posição e movimento dos alvos; avaliação da visibilidade.","keypoints":[{"label":"Visibilidade","all":[["visibilidade","visibility"]]},{"label":"Densidade de tráfego","all":[["tráfego","trafego","traffic"]]},{"label":"Manobrabilidade / distância de parada","all":[["parada","manobrab","giro","stopping"]]},{"label":"Luz de fundo à noite","all":[["luz de fundo","luzes de terra","background"]]},{"label":"Vento, mar, corrente","all":[["vento","mar","corrente","wind"]]},{"label":"Calado x profundidade","all":[["calado","draught","profundidade"]]},{"label":"Fatores de radar (escala, limitações)","all":[["radar"],["escala","limita","range"]]}],"misconceptions":[{"label":"Afirmou que vale só em visibilidade restrita","any":["só em visibilidade restrita","somente em neblina","apenas em nevoeiro"]}]},{"id":"O-17","rule":"17","prompt":"Quais as obrigações da embarcação que tem preferência na Regra 17? Distinga 'deve' e 'pode'.","reference":"(a)(i) DEVE manter rumo e velocidade. (a)(ii) PODE manobrar sozinha quando ficar evidente que a outra não age. (b) DEVE agir quando a colisão não puder ser evitada só pela outra. (c) mecânica, cruzando, não guina para bombordo para embarcação a seu bombordo. (d) não exime a obrigada.","keypoints":[{"label":"Manter rumo e velocidade","all":[["rumo","course"],["velocidade","speed"]]},{"label":"Pode manobrar se a outra não agir (a)(ii)","all":[["pode","may"]]},{"label":"Deve agir quando a colisão não puder ser evitada (b)","all":[["deve","shall"],["colisão","collision"]]},{"label":"Não guinar para bombordo p/ embarcação a bombordo (c)","all":[["bombordo","port"]]},{"label":"Não exime a obrigada a manobrar (d)","all":[["exime","não isenta","relieve","obrigação"]]}],"misconceptions":[{"label":"Disse que deve guinar para bombordo","any":["guinar para bombordo","alterar para bombordo"]}]},{"id":"O-19","rule":"19","prompt":"Como agir em visibilidade restrita ao detectar, só pelo radar, uma embarcação a vante do través?","reference":"Determinar se há situação de muita proximidade/risco e agir com antecedência. Evitar guinar para bombordo para embarcação a vante do través (salvo ultrapassada) e evitar guinar na direção de embarcação pelo través ou para ré. Se não puder evitar muita proximidade ou ouvir sinal a vante do través: reduzir ao mínimo de governo, tirar o seguimento se preciso, extrema cautela. Velocidade segura e máquinas prontas.","keypoints":[{"label":"Agir com antecedência","all":[["antecedência","cedo","ample time"]]},{"label":"Evitar guinar para bombordo","all":[["bombordo","port"]]},{"label":"Exceção: embarcação ultrapassada","all":[["ultrapassad","overtaken"]]},{"label":"Reduzir ao mínimo de governo","all":[["reduzir","mínimo","minimum"]]},{"label":"Máquinas prontas / velocidade segura","all":[["máquinas","velocidade segura","safe speed","engines"]]}],"misconceptions":[{"label":"Aplicou Regra 14/15 a quem não se avista","any":["roda a roda","rumos cruzados"]}]},{"id":"O-13","rule":"13","prompt":"Defina ultrapassagem e explique as obrigações da embarcação que ultrapassa.","reference":"Aproximar-se vindo de mais de 22,5 graus para ré do través (à noite, veria só a luz de alcançado). A ultrapassadora mantém-se fora do caminho, prevalecendo sobre as Seções I e II. Em dúvida, considera-se ultrapassando. Mudança posterior de marcação não a torna cruzando nem a exime até estar safa.","keypoints":[{"label":"Mais de 22,5 graus para ré do través","all":[["22,5","22.5","vinte e dois"]]},{"label":"Só a luz de alcançado à noite","all":[["alcançado","sternlight","popa"]]},{"label":"Ultrapassadora mantém-se fora do caminho","all":[["fora do caminho","keep out","manobra"]]},{"label":"Em dúvida, considera-se ultrapassando","all":[["dúvida","doubt"]]},{"label":"Mudança de marcação não a exime","all":[["marcação","bearing"]]}],"misconceptions":[{"label":"Disse que a ultrapassada deve manobrar","any":["ultrapassada deve manobrar","ultrapassada manobra"]}]}]};</script>

<script>/* Offline oral-answer check: keyword coverage of reference key points.

    var cells = counts.map(function (n, i) { var dt = new Date(Date.now() + i * 864e5); return '<div class="day' + (n >= 10 ? ' hot' : '') + '">' + (i === 0 ? 'hoje' : dn[dt.getDay()] + ' ' + dt.getDate()) + '<b>' + n + '</b></div>'; }).join('');
    var od = questions().filter(function (q) { var c = S.cards[q.id]; return c && c.n && !c.susp && c.due < t; }).slice(0, 30)
      .map(function (q) { return '<tr><td>' + esc(q.id) + '</td><td>' + esc(topicKey(q)) + '</td><td>' + dueLabel(S.cards[q.id]) + '</td></tr>'; }).join('');
    return '<div class="card"><h2>Próximos 14 dias</h2><p>Vencidas: <b class="' + (overdue ? 'warn' : '') + '">' + overdue + '</b></p><div class="cal">' + cells + '</div></div>' +
      '<div class="card"><h2>Vencidas</h2>' + (od ? '<table>' + od + '</table>' : '<p class="muted">Nada vencido.</p>') + '<p class="muted" style="font-size:12px">Agendamento: ' + esc(SRS.NAME) + '. Os óculos priorizam vencidas, erros repetidos, tópicos fracos e cartões nunca vistos.</p></div>';
  }
  function vCards() {
    var t = cardFilter.q.toLowerCase();
    var list = questions().filter(function (q) { return (!cardFilter.subj || q.subject === cardFilter.subj) && (!t || (q.id + ' ' + q.question + ' ' + (q.rule || '')).toLowerCase().indexOf(t) >= 0); });
    var rows = list.map(function (q) {
      var c = S.cards[q.id] || {};
      var opts = q.options.map(function (o, i) { return '<li' + (i === q.answer ? ' class="ok"' : '') + '>' + esc(o) + (q.distractors && q.distractors[i] ? ' <span class="muted">- ' + esc(q.distractors[i]) + '</span>' : '') + '</li>'; }).join('');
      return '<details><summary><b>' + esc(q.id) + '</b> ' + badge(q.status) + ' <span class="muted">' + esc(topicKey(q)) + ' · nível ' + q.difficulty + ' · ' + (c.n ? pct(c.ok, c.n) + '% de ' + c.n : 'sem respostas') + ' · </span>' + dueLabel(c) +
        (q.origin === 'import' ? ' <span class="pill">importada' + (deckEligible(q) ? '' : ' · só iPhone') + '</span>' : '') + '</summary>' +
        '<p>' + esc(q.question) + '</p><ol type="A">' + opts + '</ol><p>' + esc(q.explanation) + '</p><p class="muted">Ref.: ' + esc(q.ref) + ' · erros: ' + (c.lapses || 0) + ' · próxima revisão: ' + (c.due != null ? new Date((c.due) * 864e5).toISOString().slice(0, 10) : '-') + '</p>' +
        '<div class="row"><button class="sec" data-susp="' + esc(q.id) + '">' + (c.susp ? 'Reativar' : 'Suspender') + '</button><button class="sec" data-reset="' + esc(q.id) + '">Reiniciar progresso</button>' +
        (q.origin === 'import' ? '<button class="sec" data-del="' + esc(q.id) + '">Remover</button>' : '') + '</div></details>';
    }).join('');
    return '<div class="card"><h2>Cartões (' + list.length + ')</h2><div class="row"><select id="cf-subj"><option value="">Todas</option>' +
      BANK.subjects.map(function (s) { return '<option value="' + s.key + '"' + (cardFilter.subj === s.key ? ' selected' : '') + '>' + esc(s.pt) + '</option>'; }).join('') + '</select>' +
      '<input id="cf-q" class="grow" placeholder="Buscar id, texto, regra" value="' + esc(cardFilter.q) + '"></div>' + rows + '</div>';
  }
  function vImport() {
    var r = lastImport, rep = '';
    if (r) rep = r.error ? '<p class="bad">' + esc(r.error) + '</p>' : '<p class="ok">' + r.ok + ' questões importadas.</p>' +
      (r.errs.length ? '<p class="bad">Rejeitadas:</p><ul>' + r.errs.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>' : '') +
      (r.warns.length ? '<p class="warn">Avisos:</p><ul>' + r.warns.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>' : '');
    var nDeck = S.imported.filter(deckEligible).length;
    return '<div class="card"><h2>Importar banco de questões (JSON)</h2><p class="muted" style="font-size:12px">Formato: array ou {"questions":[...]} com id, subject (' + SUBJ.join(', ') + '), question, options (2-5), answer (índice), explanation, ref, difficulty 1-5, lang pt/en, status (verified | reviewed | ai_generated | unverified), source {title, edition, section}, tags, fig opcional. Sem status, a questão fica como NÃO verificada.</p>' +
      '<input type="file" id="im-file" accept=".json,application/json"><label>ou cole o JSON</label><textarea id="im-text" placeholder="[{&quot;id&quot;:&quot;MEU-01&quot;, ...}]"></textarea>' +
      '<div class="row" style="margin-top:8px"><button class="act" id="im-go">Validar e importar</button></div>' + rep + '</div>' +
      '<div class="card"><h2>Enviar aos óculos</h2><p>' + S.imported.length + ' importadas, ' + nDeck + ' cabem nos óculos. O envio usa até 24 questões (limite de memória dos óculos), priorizando as vencidas. Elas aparecem em “Enviadas pelo iPhone” e em “Todas as matérias”.</p>' +
      '<button class="act" id="im-deck"' + (nDeck ? '' : ' disabled') + '>Enviar questões importadas</button> <span class="muted">nos óculos agora: ' + (S.glasses.deck || 0) + '</span></div>' +
      '<div class="card"><h2>Backup</h2><div class="row"><button class="sec" id="bk-export">Exportar backup</button><button class="sec" id="bk-show">Mostrar como texto</button><button class="sec" id="bk-restore">Restaurar do texto</button></div><textarea id="bk-text" placeholder="Cole aqui um backup para restaurar"></textarea></div>';
  }
  function vOral() {
    var hist = S.oral.slice(0, 10).map(function (o) {
      var it = BANK.oral.find(function (x) { return x.id === o.id; }) || {};
      return '<details><summary>' + new Date(o.t).toLocaleString('pt-BR') + ' · <b>' + o.score + '%</b> ' + (o.method === 'ai' ? '(IA)' : '(palavras-chave)') + ' · ' + esc((it.prompt || o.id).slice(0, 60)) + '</summary>' +
        '<p><b>Transcrição:</b> ' + esc(o.text || '(vazia)') + '</p><p><b>Faltou:</b> ' + esc((o.missing || []).join('; ') || 'nada') + '</p>' + ((o.incorrect || []).length ? '<p class="warn"><b>Possível erro:</b> ' + esc(o.incorrect.join('; ')) + '</p>' : '') +
        '<p class="muted"><b>Referência:</b> ' + esc(it.reference || '') + '</p></details>';
    }).join('');
    return '<div class="card"><h2>Exame oral</h2><p>Nos óculos: Exame oral → escolha a pergunta → <b>Gravar</b> (toque explícito; indicador “GRAVANDO” visível) → toque para parar → <b>Avaliar no iPhone</b>. A transcrição usa o serviço documentado do Mira (0x0001-0x0003). Gravação para sozinha em 2 min, ao sair da tela ou ao fechar o app.</p>' +
      '<p class="muted" style="font-size:12px">Transcrever voz não é compreender. A avaliação padrão compara palavras-chave da resposta de referência e indica pontos faltantes; ela não julga o significado. Avaliação semântica requer o backend opcional abaixo.</p></div>' +
      '<div class="card"><h2>Avaliações</h2>' + (hist || '<p class="muted">Nenhuma ainda.</p>') + '</div>' +
      '<div class="card"><h2>IA opcional (seu backend)</h2><label><input type="checkbox" id="ai-on"' + (S.settings.aiOn ? ' checked' : '') + '> Usar backend de IA para avaliar respostas orais</label>' +
      '<label>URL HTTPS do seu backend (nenhuma chave é guardada aqui)</label><input id="ai-url" style="width:100%" value="' + esc(S.settings.aiUrl) + '" placeholder="https://seu-servidor/evaluate">' +
      '<p class="muted" style="font-size:12px">O backend recebe a pergunta, a referência, os pontos-chave, o resumo da regra (recuperado do banco) e a transcrição, e guarda as chaves de API no servidor. Se falhar, a avaliação offline é usada. Veja backend/README.md.</p></div>';
  }
  function vSources() {
    var cov = BANK.subjects.map(function (s) {
      var b = BANK.questions.filter(function (q) { return q.subject === s.key; }).length, im = S.imported.filter(function (q) { return q.subject === s.key; }).length;
      return '<tr><td>' + esc(s.pt) + '</td><td>' + b + '</td><td>' + im + '</td><td>' + (b + im ? '' : '<span class="warn">sem conteúdo - importe da edição vigente</span>') + '</td></tr>';
    }).join('');
    return '<div class="card"><h2>Aviso sobre o conteúdo</h2><p>' + esc(BANK.notice) + '</p><p class="muted">Banco: ' + esc(BANK.title) + ' · versão ' + esc(BANK.version) + ' · ' + BANK.questions.length + ' questões, ' + BANK.rules.length + ' resumos de regras, ' + BANK.oral.length + ' perguntas orais.</p>' +
      '<p class="muted" style="font-size:12px">A lista de matérias não é o edital: confirme no edital oficial do PSCPP 2027 quais matérias e bibliografias são exigidas.</p></div>' +
      '<div class="card"><h2>Cobertura</h2><table><tr><th>Matéria</th><th>Banco</th><th>Import.</th><th></th></tr>' + cov + '</table></div>' +
      '<div class="card"><h2>Fontes citadas</h2><table>' + BANK.sources.map(function (s) { return '<tr><td><b>' + esc(s.title) + '</b><br><span class="muted">' + esc(s.publisher) + ' · ' + esc(s.edition) + '</span></td><td>' + (s.official ? '<span class="badge b-v">oficial</span>' : '<span class="badge b-a">doutrina</span>') + '</td></tr>'; }).join('') + '</table></div>';
  }
  function vSettings() {
    return '<div class="card"><h2>Preferências</h2><label>Idioma do conteúdo nos óculos</label><select id="st-lang"><option value="0">Português</option><option value="1">English (Maritime English)</option><option value="2">Misto PT + EN</option></select>' +
      '<label>Meta diária de respostas</label><input id="st-goal" type="number" min="5" max="300" value="' + S.settings.goal + '"></div>' +
      '<div class="card"><h2>Privacidade</h2><ul><li>Sem chaves de API, senhas ou contas embutidas no app.</li><li>Progresso fica no armazenamento do app no iPhone; nada é enviado a servidores, exceto a transcrição oral se você ativar seu backend de IA.</li><li>O microfone só é usado no Exame oral, após toque explícito, com indicador de gravação; para ao tocar, ao sair da tela, após 2 min ou ao fechar o app.</li><li>Ferramenta de estudo: não usar para navegação real ou prevenção de colisão.</li></ul></div>' +
      '<div class="card"><h2>Dados</h2><button class="sec" id="st-reset">Apagar todo o progresso</button></div>';
  }
  function render() {
    if (!S) return;
    renderTabs(); renderConn();
    var el = document.getElementById('t-' + tab);
    if (tab === 'cards' && document.activeElement && document.activeElement.id === 'cf-q') return; // keep typing focus
    if (tab === 'import' && document.activeElement && /im-text|bk-text/.test(document.activeElement.id)) return;

  }

      var P = [{ mode: 0, count: 10, minutes: 5, level: 0 }, { mode: 1, count: 15, minutes: 10, level: 0 }, { mode: 0, count: 15, minutes: 15, level: 13 }, { mode: 2, count: 20, minutes: 30, level: 0 }][+b.dataset.preset];

        count: num('cs-count', 1, 40, 10), minutes: num('cs-min', 0, 180, 10) }).then(function (ok) { if (ok) toast('Sessão enviada aos óculos'); }); return;

      case 'im-deck': sendDeck(false); return;

    else if (b.dataset.reset) { if (confirm('Reiniciar o progresso desta questão?')) { delete S.cards[b.dataset.reset]; save(); schedulePush(); render(); } }
    else if (b.dataset.del) { if (confirm('Remover esta questão importada?')) { S.imported = S.imported.filter(function (q) { return q.id !== b.dataset.del; }); delete S.cards[b.dataset.del]; save(); render(); } }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target; if (!S) return;
    if (t.id === 'cf-subj') { cardFilter.subj = t.value; render(); }
    else if (t.id === 'st-lang') { S.settings.lang = +t.value; save(); pushState(false); }
    else if (t.id === 'st-goal') { S.settings.goal = num('st-goal', 5, 300, 20); save(); schedulePush(); }
    else if (t.id === 'ai-on') { S.settings.aiOn = t.checked; save(); }
    else if (t.id === 'ai-url') { S.settings.aiUrl = t.value.trim(); save(); if (S.settings.aiUrl && !/^https:\/\//.test(S.settings.aiUrl)) toast('Use uma URL https://'); }
    else if (t.id === 'im-file' && t.files && t.files[0]) { t.files[0].text().then(function (x) { document.getElementById('im-text').value = x; }); }
  });
  document.addEventListener('input', function (ev) {
    if (ev.target.id === 'cf-q') { cardFilter.q = ev.target.value; clearTimeout(render.t); render.t = setTimeout(function () { var el = document.getElementById('t-cards'); el.innerHTML = vCards(); var i = document.getElementById('cf-q'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 250); }
  });

  // ---------- start ----------
  load().then(function (d) {
    S = Object.assign(blank(), d && d.v === 1 ? d : {});
    S.settings = Object.assign(blank().settings, S.settings || {});
    S.glasses = Object.assign(blank().glasses, S.glasses || {});
    S.imported.forEach(function (q) { q._glyphs = LAY.glyphsOk([q.question, q.explanation, q.ref, q.rule].concat(q.options).join('\n')); q._fits = LAY.fits(q); });
    render();
    if (MC && MC.onFromApp) {
      var off = MC.onFromApp(onMessage);
      window.addEventListener('pagehide', function () { if (typeof off === 'function') off(); });
      pushState(true);
      send({ type: 'sync' }, true);
      setInterval(function () { pushState(false); renderConn(); }, 12000);
    }
  });
})();
